<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход для менеджера · Babushka</title><link rel="stylesheet" href="/admin/admin.css"><script defer src="/admin/login.js"></script></head>
<body><main class="login-page"><section>
<div class="brand"><img src="/assets/logo-headscarf.png" alt=""><strong>Babushka Exchange</strong></div>
<h1>Вход для менеджера</h1>
<form id="login-form" method="post" action="/api/auth/login">
<label>Логин<input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="48" required autofocus></label>
<label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
<p class="hint" id="login-error" role="alert"></p><button class="primary" type="submit">Войти</button>
</form><details class="login-help"><summary>Первый вход или сброс пароля</summary><p>На компьютере с сервером откройте «Настроить доступ.command» в папке проекта. Для нового менеджера создайте отдельный логин.</p></details>
</section></main></body></html>
